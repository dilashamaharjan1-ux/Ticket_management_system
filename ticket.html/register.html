<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ticket Booking - Register</title>

<style>
body{
    margin:0;
    font-family:Arial, sans-serif;
    background:#d9ecff;
}

.main{
    width:850px;
    margin:50px auto;
    display:flex;
    border-radius:10px;
    overflow:hidden;
    box-shadow:0 0 10px gray;
}

.left{
    width:40%;
    background:#1565c0;
    color:white;
    text-align:center;
    padding:60px 20px;
}

.left h1{
    font-size:32px;
}

.left p{
    line-height:1.6;
}

.right{
    width:60%;
    background:white;
    padding:30px;
}

.right h2{
    text-align:center;
    color:#1565c0;
}

input{
    width:95%;
    padding:10px;
    margin:10px 0;
    border:1px solid #999;
    border-radius:5px;
}

button{
    width:100%;
    padding:12px;
    background:#1565c0;
    color:white;
    border:none;
    border-radius:5px;
    font-size:16px;
    cursor:pointer;
}

button:hover{
    background:#0d47a1;
}

a{
    text-decoration:none;
    color:#1565c0;
}

.footer{
    text-align:center;
    margin-top:15px;
}
</style>

</head>
<body>

<div class="main">

    <div class="left">
        <h1>🎟 Ticket Booking</h1>
        <p>Create your account to book bus, train, movie, and event tickets easily.</p>
    </div>

    <div class="right">

        <h2>Create Account</h2>

        <form>

            <input type="text" placeholder="Full Name" required>

            <input type="email" placeholder="Email Address" required>

            <input type="text" placeholder="Username" required>

            <input type="password" placeholder="Password" required>

            <input type="password" placeholder="Confirm Password" required>

            <button type="submit">Register</button>

        </form>

        <div class="footer">
            Already have an account?
            <a href="login.html">Login</a>
        </div>

    </div>

</div>

</body>
</html>
