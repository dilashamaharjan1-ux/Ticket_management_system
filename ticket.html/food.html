<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .food-order{
            padding:60px 8%;
            background:#f7f7f7;
            }
            .food-card{
background:#fff;
border-radius:15px;
box-shadow:0 8px 20px rgba(0,0,0,.1);
text-align:center;
padding:20px;
transition:.3s;
}
.food-card:hover{
transform:translateY(-8px);
}
.food-card img{
width:100%;
height:180px;
object-fit:cover;
border-radius:10px;
}
.food-card h3{
margin:15px 0 8px;
}
.food-card p{
color:#4B1FA7;
font-weight:bold;
margin-bottom:15px;
}
.food-card input{
width:80px;
padding:10px;
text-align:center;
font-size:16px;
}

.food-btn{
text-align:center;
margin-top:40px;
}

.food-btn button{
padding:15px 50px;
background:#4B1FA7;
color:white;
border: 2px;;
border-radius:8px;
font-size:18px;

}

.food-btn button:hover{
background:#31117a;
}
    </style>
</head>
<body>
    <section class="food order">
        <h2>Order Food & Drink </h2>
         
        <div class="allfood">
                <div class="food-card">
                <img src="https://images.unsplash.com/photo-1578849278619-e73505e9610f?w=400" alt="Popcorn">
                <h3>Popcorn</h3>
                <p>Rs. 250</p>
                <input type="number" min="0" value="0">
                </div>

                <div class="food-card">
            <img src="https://images.unsplash.com/photo-1554866585-cd94860890b7?w=400" alt="Burger">
            <h3>Burger</h3>
            <p>Rs. 350</p>
            <input type="number" min="0" value="0">
            </div>

            <div class="food-card">
            <img src="https://images.unsplash.com/photo-1544145945-f90425340c7e?w=400" alt="French Fries">
            <h3>French Fries</h3>
            <p>Rs. 200</p>
            <input type="number" min="0" value="0">
            </div>

            <div class="food-card">
            <img src="https://images.unsplash.com/photo-1622484212850-eb596d769edc?w=400" alt="Coke">
            <h3>Coke</h3>
            <p>Rs. 120</p>
            <input type="number" min="0" value="0">
            </div>

            <div class="food-card">
            <img src="https://images.unsplash.com/photo-1513104890138-7c749659a591?w=400" alt="Pizza">
            <h3>Pizza</h3>
            <p>Rs. 500</p>
            <input type="number" min="0" value="0">
            </div>

            <div class="food-card">
            <img src="https://images.unsplash.com/photo-1504674900247-0877df9cc836?w=400" alt="Combo">
            <h3>Movie Combo</h3>
            <p>Rs. 650</p>
            <input type="number" min="0" value="0">
            </div>

            </div>

          


                
        </div>
    </section>
</body>
</html>
