<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ticket Management System</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: #f5f5f5;
            font-family: Arial, sans-serif;
            color: #222;
        }

        /* HEADER */
        .ticket {
            background: linear-gradient(135deg, #16002e, #4B1FA7);
            min-height: 80px;
            padding: 20px 6%;
            display: flex;
            align-items: center;
            justify-content: space-between;
            box-shadow: 0 5px 20px rgba(0,0,0,0.3);
        }

        .logo {
            color: white;
            font-size: 28px;
            font-weight: 700;
        }

        nav {
            display: flex;
            align-items: center;
        }

        .home {
            display: flex;
            align-items: center;
            gap: 30px;
        }

        .home a {
            color: white;
            text-decoration: none;
            font-size: 16px;
            font-weight: bold;
            transition: 0.3s;
        }

        .home a:hover {
            color: #ffd43b;
        }

        .login {
            background: white;
            color: #4B1FA7 !important;
            padding: 10px 25px;
            border-radius: 25px;
            text-decoration: none;
            font-weight: 600;
        }

        .login:hover {
            background: #ffd43b;
            color: #222 !important;
        }

        /* HERO */
        .title {
            text-align: center;
            color: white;
            font-size: 40px;
            padding-top: 70px;
        }

        .ticket::after {
            content: "Find your favorite movies and book your seats easily";
            position: absolute;
            left: 0;
            right: 0;
            margin-top: 190px;
            text-align: center;
            color: #ddd;
            font-size: 17px;
        }

        .ticket {
            position: relative;
            height: 300px;
        }

        /* SEARCH */
        .movies {
            width: 90%;
            max-width: 1300px;
            margin: 40px auto;
        }

        .movies:before {
            content: "🔍  Search movies...";
            display: block;
            width: 90%;
            max-width: 600px;
            margin: -5px auto 45px;
            background: white;
            color: #888;
            padding: 17px 25px;
            border-radius: 30px;
            box-shadow: 0 5px 20px rgba(0,0,0,0.12);
            font-size: 16px;
        }

        /* SECTION TITLE */
        .movies > h2 {
            margin: 35px 0 25px;
            font-size: 27px;
            border-left: 6px solid #4B1FA7;
            padding-left: 12px;
            color: #333;
        }

        /* CARDS */
        .cards,
        .area {
            display: flex;
            gap: 30px;
            flex-wrap: wrap;
            justify-content: center;
        }

        .card {
            width: 270px;
            background: white;
            border-radius: 18px;
            overflow: hidden;
            box-shadow: 0 8px 25px rgba(0,0,0,0.12);
            transition: 0.4s;
        }

        .card:hover {
            transform: translateY(-12px);
            box-shadow: 0 18px 35px rgba(75,31,167,0.3);
        }

        .card img {
            width: 100%;
            height: 360px;
            object-fit: cover;
            display: block;
            transition: 0.4s;
        }

        .card:hover img {
            transform: scale(1.04);
        }

        .card h3 {
            text-align: center;
            font-size: 21px;
            padding: 17px 5px 10px;
        }

        /* BOOK BUTTON */
        .card a {
            text-decoration: none;
        }

        .card h3:after {
            content: "Book Now";
            display: block;
            width: 75%;
            margin: 12px auto 5px;
            padding: 10px;
            background: #4B1FA7;
            color: white;
            border-radius: 7px;
            font-size: 14px;
            transition: 0.3s;
        }

        .card:hover h3:after {
            background: #6d32d4;
        }

        /* FOOTER */
        footer {
            margin-top: 70px;
            background: #16002e;
            color: white;
            text-align: center;
            padding: 25px;
        }

        footer p {
            margin: 5px;
        }

        /* MOBILE */
        @media (max-width: 768px) {

            .ticket {
                height: 330px;
                display: block;
                text-align: center;
            }

            .logo {
                font-size: 23px;
                margin-bottom: 25px;
            }

            .home {
                justify-content: center;
            }

            .title {
                font-size: 30px;
                padding-top: 55px;
            }

            .card {
                width: 90%;
                max-width: 300px;
            }

            .card img {
                height: 390px;
            }
        }
    </style>
</head>

<body>

<!-- HEADER -->
<div class="ticket">

    <div class="logo">
        🎟 Ticket Management System
    </div>

    <nav>
        <div class="home">
            <a href="#">Home</a>
            <a href="#">Movies</a>
            <a href="#">Contact</a>
            <a href="#" class="login">Login</a>
        </div>
    </nav>

    <h2 class="title">Book Movie Tickets</h2>

</div>


<!-- MOVIES -->
<section class="movies">

    <h2>🔥 Now Showing</h2>

    <div class="cards">

        <div class="card">
            <a href="booking.html">
                <img src="spiderman.jpg" alt="Spider-Man">
                <h3>Spider-Man</h3>
            </a>
        </div>

        <div class="card">
            <a href="booking.html">
                <img src="Titanic.jpg" alt="Titanic">
                <h3>Titanic</h3>
            </a>
        </div>

        <div class="card">
            <a href="booking.html">
                <img src="Batman.jpg" alt="Batman">
                <h3>The Batman</h3>
            </a>
        </div>

        <div class="card">
            <a href="booking.html">
                <img src="squid game.jpg" alt="Squid Game">
                <h3>Squid Game</h3>
            </a>
        </div>

    </div>


    <h2>🎬 Upcoming Movies</h2>

    <div class="area">

        <div class="card">
            <a href="booking.html">
                <img src="wednesday.jpg" alt="Wednesday">
                <h3>Wednesday</h3>
            </a>
        </div>

        <div class="card">
            <a href="booking.html">
                <img src="avatar.jpg" alt="Avatar">
                <h3>Avatar</h3>
            </a>
        </div>

    </div>

</section>


<!-- FOOTER -->
<footer>
    <p>🎟 Ticket Management System</p>
    <p>Book your movie tickets easily and quickly.</p>
</footer>

</body>
</html>
